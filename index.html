<title>بازی ترجمه عربی نهم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: Tahoma, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff; padding: 15px;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  .game-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px; padding: 25px 20px;
    width: 100%; max-width: 500px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.2rem; margin-bottom: 10px; color: #ffd700; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  .lesson-btn {
    padding: 15px 10px; font-size: 1rem; font-family: inherit;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
    background: rgba(255,255,255,0.15); color: #fff; cursor: pointer; transition: 0.2s;
  }
  .lesson-btn:hover:not(:disabled) { background: rgba(255,255,255,0.3); }
  
  /* استایل تایمر */
  .timer-container {
    width: 100%; height: 10px; background: rgba(255,255,255,0.2);
    border-radius: 10px; margin-bottom: 15px; overflow: hidden;
  }
  .timer-bar {
    height: 100%; width: 100%; background: #28a745; border-radius: 10px;
    transition: width 1s linear, background-color 0.5s;
  }
  .timer-text { font-size: 0.9rem; color: #ffd700; margin-bottom: 10px; font-weight: bold; }

  .score { margin-bottom: 10px; color: #ffd700; font-size: 0.95rem; }
  .word {
    font-size: 2.2rem; font-weight: bold; margin: 18px 0;
    text-shadow: 0 0 20px rgba(255,215,0,0.6); word-break: break-word;
  }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
  .option {
    padding: 14px 8px; font-size: 0.95rem; font-family: inherit;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
    background: rgba(255,255,255,0.15); color: #fff; cursor: pointer; transition: 0.15s; min-height: 58px;
  }
  .option.correct { background: #28a745; border-color: #28a745; }
  .option.wrong { background: #dc3545; border-color: #dc3545; }
  .option:disabled { cursor: not-allowed; opacity: 0.9; }
  .message { margin-top: 18px; font-size: 1rem; min-height: 26px; font-weight: bold; }
  .confetti {
    position: fixed; width: 10px; height: 10px; top: -12px; z-index: 999;
    animation: fall linear forwards; border-radius: 2px; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0; } }
  .action-btn {
    margin-top: 18px; padding: 12px 20px; background: #ffd700; color: #1e3c72;
    border: none; border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: bold;
    cursor: pointer; display: none; width: 100%;
  }
  .back-btn { background: #4ecdc4; color: #1e3c72; margin-bottom: 10px; display: inline-block; width: auto; padding: 8px 15px; font-size: 0.9rem; }
</style>
</head>

  var currentLessonData = [];

  var order = [];
  var currentLessonNum = 1;

  // متغیرهای تایمر
  var timerInterval;
  var timeLeft = 7;
  var maxTime = 7;

  var menuScreen = document.getElementById("menuScreen");
  var playScreen = document.getElementById("playScreen");
  var lessonList = document.getElementById("lessonList");
  var lessonTitle = document.getElementById("lessonTitle");
  var wordEl = document.getElementById("word");
  var optionsEl = document.getElementById("options");
  var messageEl = document.getElementById("message");
  var scoreEl = document.getElementById("score");
  var totalEl = document.getElementById("total");
  var restartBtn = document.getElementById("restartBtn");
  var backBtn = document.getElementById("backBtn");
  
  // المنت‌های تایمر
  var timerBar = document.getElementById("timerBar");
  var timerText = document.getElementById("timerText");

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildMenu() {
    lessonList.innerHTML = "";
    for (var i = 1; i <= 10; i++) {
      (function(lessonNum) {
        var btn = document.createElement("button");
        btn.className = "lesson-btn";
        btn.textContent = "درس " + lessonNum;
        btn.onclick = function() { startLesson(lessonNum); };
        lessonList.appendChild(btn);
      })(i);
    }
  }

  function startLesson(lessonNum) {
    currentLessonNum = lessonNum;
    currentLessonData = allLessons[lessonNum];
    lessonTitle.textContent = "بازی درس " + lessonNum;
    menuScreen.style.display = "none";
    playScreen.style.display = "block";
    startGame();
  }

  function startGame() {
    score = 0;
    currentIndex = 0;
    order = shuffle(currentLessonData);
    scoreEl.textContent = score;
    totalEl.textContent = order.length;
    messageEl.textContent = "";
    restartBtn.style.display = "none";
    loadQuestion();
  }

  function loadQuestion() {
    clearInterval(timerInterval); // تایمر قبلی رو متوقف کن
    
    if (currentIndex >= order.length) {
      wordEl.textContent = ":tada:";
      optionsEl.innerHTML = "";
      messageEl.textContent = "بازی تمام شد! امتیاز: " + score + " از " + order.length;
      messageEl.style.color = "#ffd700";
      restartBtn.style.display = "block";
      timerBar.style.width = "0%";
      timerText.style.display = "none";
      return;
    }
var q = order[currentIndex];
    wordEl.textContent = q.word;
    messageEl.textContent = "";
    messageEl.style.color = "#fff";
    
    var allOptions = [q.correct].concat(q.wrongs.slice(0, 3));
    var shuffledOptions = shuffle(allOptions);
    
    optionsEl.innerHTML = "";
    for (var i = 0; i < shuffledOptions.length; i++) {
      var btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = shuffledOptions[i];
      btn.setAttribute("data-value", shuffledOptions[i]);
      btn.onclick = (function (b, val) {
        return function () { checkAnswer(b, val, q.correct); };
      })(btn, shuffledOptions[i]);
      optionsEl.appendChild(btn);
    }

    // شروع تایمر برای سوال جدید
    startTimer(q.correct);
  }

  function startTimer(correctAnswer) {
    timeLeft = maxTime;
    timerBar.style.width = "100%";
    timerBar.style.backgroundColor = "#28a745";
    timerText.style.display = "block";
    timerText.textContent = "زمان: " + timeLeft + " ثانیه";

    timerInterval = setInterval(function() {
      timeLeft--;
      timerText.textContent = "زمان: " + timeLeft + " ثانیه";
      
      // محاسبه درصد برای نوار تایمر
      var percentage = (timeLeft / maxTime) * 100;
      timerBar.style.width = percentage + "%";

      // تغییر رنگ در ثانیه‌های آخر
      if (timeLeft <= 3) {
        timerBar.style.backgroundColor = "#dc3545"; // قرمز
      } else if (timeLeft <= 5) {
        timerBar.style.backgroundColor = "#ffc107"; // زرد
      }

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        timeOut(correctAnswer);
      }
    }, 1000);
  }

  function timeOut(correctAnswer) {
    // غیرفعال کردن دکمه‌ها
    var all = optionsEl.querySelectorAll(".option");
    for (var i = 0; i < all.length; i++) {
      all[i].disabled = true;
      if (all[i].getAttribute("data-value") === correctAnswer) {
        all[i].classList.add("correct"); // نمایش جواب درست
      }
    }
    
    messageEl.textContent = ":alarm_clock: زمان تمام شد! جواب: " + correctAnswer;
    messageEl.style.color = "#dc3545";
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

    currentIndex++;
    setTimeout(loadQuestion, 2000); // ۲ ثانیه مکث قبل از سوال بعدی
  }

  function checkAnswer(btn, selected, correct) {
    clearInterval(timerInterval); // وقتی جواب داد، تایمر رو نگه دار
    
    var all = optionsEl.querySelectorAll(".option");
    for (var i = 0; i < all.length; i++) all[i].disabled = true;

    if (selected === correct) {
      btn.classList.add("correct");
      score++;
      scoreEl.textContent = score;
      messageEl.textContent = ":white_check_mark: درست بود!";
      messageEl.style.color = "#28a745";
      launchConfetti();
      if (navigator.vibrate) navigator.vibrate(50);
    } else {
      btn.classList.add("wrong");
      messageEl.textContent = ":x: اشتباه! جواب: " + correct;
      messageEl.style.color = "#dc3545";
      for (var j = 0; j < all.length; j++) {
        if (all[j].getAttribute("data-value") === correct) all[j].classList.add("correct");
      }
      if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
    }
    currentIndex++;
    setTimeout(loadQuestion, 1600);
  }

  function launchConfetti() {
    var colors = ["#ffd700","#ff6b6b","#4ecdc4","#45b7d1","#96ceb4","#ffeaa7","#fd79a8"];
    for (var i = 0; i < 50; i++) {
      var conf = document.createElement("div");
      conf.className = "confetti";
      conf.style.left = Math.random() * 100 + "vw";
      conf.style.background = colors[Math.floor(Math.random() * colors.length)];
      conf.style.width = (Math.random() * 8 + 5) + "px";
      conf.style.height = (Math.random() * 8 + 5) + "px";
      conf.style.animationDuration = (Math.random() * 2 + 1.5) + "s";
      conf.style.animationDelay = (Math.random() * 0.3) + "s";
      conf.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
      document.body.appendChild(conf);
      (function (c) {
        setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 4000);
      })(conf);
    }
  }
restartBtn.onclick = startGame;
  backBtn.onclick = function() {
    clearInterval(timerInterval); // تایمر رو متوقف کن
    playScreen.style.display = "none";
    menuScreen.style.display = "block";
  };
